<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>처음 배우는 지뢰찾기</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="hero" aria-labelledby="game-title">
      <p class="eyebrow">초보자도 바로 시작하는 웹 게임</p>
      <h1 id="game-title">지뢰찾기</h1>
      <p class="description">
        칸을 열어 숫자를 확인하고, 지뢰가 있을 것 같은 칸에는 깃발을 꽂아보세요.
        모든 안전한 칸을 열면 승리합니다!
      </p>
    </section>

    <section class="panel controls" aria-label="게임 설정">
      <label for="difficulty">난이도</label>
      <select id="difficulty">
        <option value="easy">쉬움: 9 × 9 / 지뢰 10개</option>
        <option value="normal">보통: 12 × 12 / 지뢰 22개</option>
        <option value="hard">어려움: 16 × 16 / 지뢰 45개</option>
      </select>
      <button id="new-game" type="button">새 게임</button>
    </section>

    <section class="panel status-bar" aria-label="게임 상태">
      <div>
        <span class="label">남은 지뢰</span>
        <strong id="mine-count">10</strong>
      </div>
      <div>
        <span class="label">시간</span>
        <strong><span id="timer">0</span>초</strong>
      </div>
      <div>
        <span class="label">상태</span>
        <strong id="status">준비 완료</strong>
      </div>
    </section>

    <section class="panel guide" aria-labelledby="guide-title">
      <h2 id="guide-title">처음 하는 분을 위한 사용법</h2>
      <ol>
        <li>안전해 보이는 칸을 <strong>왼쪽 클릭</strong>해서 엽니다.</li>
        <li>숫자는 주변 8칸에 있는 지뢰 개수를 뜻합니다.</li>
        <li>지뢰가 의심되는 칸은 <strong>오른쪽 클릭</strong> 또는 길게 눌러 깃발을 꽂습니다.</li>
        <li>실수했다면 깃발 칸을 다시 오른쪽 클릭해서 해제하세요.</li>
      </ol>
    </section>

    <section class="board-wrap" aria-label="지뢰찾기 게임판">
      <div id="board" class="board"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
